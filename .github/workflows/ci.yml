name: Pomo CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash and Python syntax
        run: |
          bash -n pomo
          bash -n tests/run_tests.sh
          bash -n build-deb.sh
          bash -n test-pomo-windows-integration.sh
          bash -n test-pomo-wsl-integration.sh
          bash -n test-windows-input-integration.sh
          bash -n test-windows-tracker.sh
          bash -n test-wsl-process-tracker.sh
          python3 -m py_compile wsl-process-tracker.py

      - name: Lint with ShellCheck
        run: |
          shellcheck -x --severity=warning pomo tests/run_tests.sh build-deb.sh
          shellcheck -x --severity=warning test-pomo-windows-integration.sh test-pomo-wsl-integration.sh
          shellcheck -x --severity=warning test-windows-input-integration.sh test-windows-tracker.sh
          shellcheck -x --severity=warning test-wsl-process-tracker.sh

      - name: Run test suite
        run: bash tests/run_tests.sh

      - name: Run WSL tracking integration tests
        run: |
          ./test-pomo-wsl-integration.sh
          ./test-wsl-process-tracker.sh

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Verify package metadata
        shell: bash
        run: |
          version=$(sed -n \
            's/^readonly POMO_VERSION="\([^"]*\)"$/\1/p' pomo | head -n 1)

          test -n "$version"
          package="build/pomo_${version}-1_all.deb"
          test -f "$package"

          test "$(dpkg-deb -f "$package" Package)" = "pomo"
          test "$(dpkg-deb -f "$package" Version)" = "${version}-1"
          test "$(dpkg-deb -f "$package" Architecture)" = "all"
          test -n "$(dpkg-deb -f "$package" Maintainer)"

          package_root=$(mktemp -d)
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb -x "$package" "$package_root"
          test -f "$package_root/usr/lib/pomo/windows-tracker.ps1"
          test -f "$package_root/usr/lib/pomo/wsl-process-tracker.py"

          echo "Package metadata verified: $package"

  release:
    # Tag v*: build .deb lalu lampirkan sebagai asset GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Attach .deb to the release
        uses: softprops/action-gh-release@v3
        with:
          files: build/pomo_*_all.deb
