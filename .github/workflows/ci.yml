name: Pomo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n pomo
          bash -n tests/run_tests.sh
          bash -n build-deb.sh

      - name: Run test suite
        run: bash tests/run_tests.sh

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Verify package metadata
        shell: bash
        run: |
          version=$(sed -n \
            's/^readonly POMO_VERSION="\([^"]*\)"$/\1/p' pomo | head -n 1)

          test -n "$version"
          package="build/pomo_${version}-1_all.deb"
          test -f "$package"

          test "$(dpkg-deb -f "$package" Package)" = "pomo"
          test "$(dpkg-deb -f "$package" Version)" = "${version}-1"
          test "$(dpkg-deb -f "$package" Architecture)" = "all"
          test -n "$(dpkg-deb -f "$package" Maintainer)"

          echo "Package metadata verified: $package"
